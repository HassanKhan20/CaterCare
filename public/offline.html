<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catercare — offline</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      background: #ECEDE6;
      color: #1A1D17;
      font-family: "DM Sans", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 360px; }
    .mark { color: #5C7546; margin-bottom: 24px; }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: #6C7064; margin: 0 0 28px; line-height: 1.5; }
    a {
      display: inline-block;
      background: #1A1D17;
      color: #ECEDE6;
      padding: 14px 24px;
      border-radius: 999px;
      font-weight: 500;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 32 32" width="48" height="48" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.4" />
        <path d="M9 16c2-3 5-3 7 0s5 3 7 0" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Catercare needs a connection to show cooks and place orders. Check your network and try again.</p>
    <a href="/browse">Retry</a>
  </div>
</body>
</html>
